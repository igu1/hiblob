name: hiblob
description: >-
  Deterministic geometric blob avatars from any string, with a pure Dart core
  and static or animated Flutter widgets.
version: 0.2.0
homepage: https://github.com/igu1/hiblob
repository: https://github.com/igu1/hiblob
issue_tracker: https://github.com/igu1/hiblob/issues
topics:
  - avatar
  - flutter
  - deterministic
  - generative-art
screenshots:
  - description: The Hiblob Studio example with appearance and motion controls.
    path: hiblob_studio.png

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  unorm_dart: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.1.1
